name: CI

on:
  push:
    branches: [main]
  pull_request:

# Mỗi workflow + branch/PR chỉ giữ 1 lần chạy. Commit mới đẩy lên PR sẽ hủy lần chạy cũ.
# Trên main thì không hủy, để commit nào trên main cũng có kết quả CI.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    name: Format, analyze & test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.38.4
          cache: true

      - name: Show Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze

      - name: Run tests with coverage
        run: flutter test --coverage

      - name: Write coverage summary
        run: |
          awk -F: '/^LF:/{found+=$2} /^LH:/{hit+=$2}
            END {printf "### Test coverage\n\n**%.1f%%** (%d/%d dòng)\n", 100*hit/found, hit, found}' \
            coverage/lcov.info >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov
          path: coverage/lcov.info
          retention-days: 7
